<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Advice Slip API</title>
</head>

<body>

    <h1>Advice Slip API</h1>

    <p id="advice">Clique no botão.</p>

    <input type="button" value="Novo conselho" onclick="buscarConselho()"> 

    <script>
        async function buscarConselho() {
            const response = await fetch('https://api.adviceslip.com/advice');
            const data = await response.json();

            document.getElementById('advice').textContent = data.slip.advice;
        }
    </script>

</body>
</html>
